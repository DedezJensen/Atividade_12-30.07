<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ShoPhone</title>
</head>

<body>

    <head>
        <h1>Cadastro na ShoPhone</h1>
    </head>

    <hr>

    <main>

        <nav>
            <img width="70" src="../assets/logomarca.png" alt="Imagem da Logo">
            <p><strong><a href="../index.html">Pagina principal</a></strong> |
                <strong><a href="./login.html">Faça seu login</a></strong>
            </p>

        </nav>

        <hr>

        <section>

            <form action="../index.html" onsubmit="alert('Cadastro realizado com sucesso')">

                <h2>Realize seu cadastro</h2>

                <p>Nome Completo:</p>
                <input required type="text" placeholder="Digite seu nome">

                <p>Email:</p>
                <input required type="email" placeholder="Digite seu email">

                <p>Senha:</p>
                <input required type="password" placeholder="Crie sua senha">

                <p>Confirme a senha:</p>
                <input required type="password" placeholder="Confirme a senha criada">

                <p>RG:</p>
                <input required type="number" placeholder="Digite seu RG">

                <p>CPF:</p>
                <input required type="number" placeholder="Digite seu CPF">

                <p>Endereço:</p>
                <input required type="text" placeholder="Digite seu endereço">

                <p>CEP:</p>
                <input required type="number" placeholder="Digite seu CEP">

                <p>Cidade:</p>
                <input required type="text" placeholder="Qual sua cidade?">

                <p>Estado:</p>
                <input required type="text" placeholder="Qual seu Estado?">

                <p>País:</p>
                <input required type="text" placeholder="Qual seu País?">

                <p>Data de nascimento:</p>
                <input required type="date" placeholder="Qual sua data de nascimento?">

                <br>
                <br>

                <button type="submit">Realizar cadastro</button>
                <br>

            </form>

        </section>

    </main>

    <hr>

    <footer>
        <h3>Já possui cadastro?</h3>
        <a href="./login.html">Faça Login</a>
    </footer>






</body>

</html>
