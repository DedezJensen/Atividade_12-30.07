<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha | ShoPhone</title>
</head>

<body>

    <head>
        <h1>Recuperação de senha</h1>
    </head>

    <hr>

    <main>

        <nav>
            <img width="70" src="../assets/logomarca.png" alt="Imagem da Logo">
            <p><strong><a href="./login.html">Faça seu login</a></strong></p>
        </nav>

        <hr>

        <img width="400" src="../assets/recuperarSenha.png" alt="Imagem recuperação de senha">

        <section>
            <form action="./login.html" onsubmit="alert('Senha recuperada com sucesso!')">

                <h2>Recupere sua senha</h2>
                <p>Email cadastrado:</p>
                <input required type="email" placeholder="Digite seu email cadastrado">

                <br>
                <br>

                <button onsubmit="Acessar"></button>
            </form>
        </section>


    </main>

    <footer>
        <h3>Relembrou a senha?</h3>
        <a href="./login.html">Faça Login</a>
    </footer>



</body>

</html>
