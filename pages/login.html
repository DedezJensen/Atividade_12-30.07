<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ShoPhone</title>
</head>

<body>

    <head>
        <h1>Login na ShoPhone</h1>
    </head>

    <hr>

    <main>

        <nav>
            <img width="70" src="../assets/logomarca.png" alt="Imagem da logo marca">
            <p><strong><a href="../index.html">Acesse a pagina principal</a> </strong></p>
        </nav>

        <hr>

        <img width="500" src="../assets/banner.jpg" alt="Banner do site">

        <section>

            <form action="../index.html" onsubmit="alert('Login realizado com sucesso')">

                <h2>Faça login para acessar sua conta</h2>

                <p>Email:</p>
                <input required type="email" placeholder="Digite seu email">

                <p>Senha:</p>
                <input required type="password" placeholder="Sigite sua senha">

                <br>
                <br>
                <button type="submit">Acessar</button>

                <button type="reset">Limpar</button>


            </form>

        </section>

    </main>

    <br>
    <hr>

    <footer>

        <p><strong>Esqueceu sua senha? <br>
            <a href="./esqueciSenha.html">Esqueci minha senha</a></strong>
        </p>

        <p><strong>Não tem cadastro? <br>
            <a href="./cadastro.html">Cadastre-se</a></strong>
        </p>

    </footer>

</body>

</html>
